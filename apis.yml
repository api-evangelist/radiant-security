name: Radiant Security
description: >-
  Radiant Security is an AI-powered Security Operations Center (SOC) platform that automates
  alert triage, investigation, and response so security teams can scale coverage without adding
  headcount. Founded in 2021 and headquartered in the SF Bay Area with offices in Tel Aviv and
  Sao Paulo, Radiant ingests alerts from 120+ security tools across email, endpoint, identity,
  network, cloud, insider-threat, SIEM, WAF, DLP, and OT/IoT sources, triages 100% of them with
  transparent AI reasoning, and escalates only genuine risks to analysts. It pairs automated
  investigation with integrated, SIEM-cost-free log management (unlimited retention with
  customer S3 buckets) and one-click response actions. The product is delivered as a hosted SaaS
  console; its public surface is product documentation and inbound connectors rather than a
  developer-facing REST API.
